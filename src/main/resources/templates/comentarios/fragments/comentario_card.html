<li th:fragment="comentarioCard(comentario)"
    th:attr="data-texto=${comentario.comentario}"
    th:id="|comentario-${comentario.codigo}|"
    x-data="{
        editando: false,
        textoOriginal: '',
        texto: '',

        editar() {
            this.textoOriginal = this.$root.dataset.texto || '';
            this.texto = this.textoOriginal;
            this.editando = true;
        },

        cancelar() {
            this.texto = this.textoOriginal;
            this.editando = false;
        }
    }"
    class="flex gap-3 p-5">

    <!-- Avatar -->
    <span class="flex h-10 w-10 shrink-0 items-center justify-center
                 rounded-full bg-blue-500/10 border border-blue-500/20
                 text-sm font-semibold text-blue-300"
          th:text="${comentario.nomeFuncionario != null
              and !comentario.nomeFuncionario.isBlank()
              ? #strings.toUpperCase(#strings.substring(comentario.nomeFuncionario, 0, 1))
              : '?'}">
    </span>

    <!-- Conteúdo -->
    <div class="flex-1 min-w-0">

        <!-- Cabeçalho -->
        <div class="flex flex-wrap items-center justify-between gap-3">

            <div class="flex flex-wrap items-center gap-x-2 gap-y-1">

                <p class="text-sm font-semibold text-slate-200"
                   th:text="${comentario.nomeFuncionario != null
                       ? comentario.nomeFuncionario
                       : 'Funcionário não identificado'}">
                </p>

                <span class="text-xs text-slate-500"
                      th:if="${comentario.dataHoraRegistro != null}"
                      th:text="${#temporals.format(comentario.dataHoraRegistro, 'dd/MM/yyyy HH:mm')}">
                </span>

            </div>

            <!-- Ações de visualização -->
            <div x-show="!editando"
                 class="flex items-center gap-2">

                <!-- Editar -->
                <button type="button"
                        @click="editar()"
                        title="Editar comentário"
                        class="inline-flex items-center gap-1.5 rounded-lg
                               px-2.5 py-1.5 text-xs font-medium
                               text-blue-400 hover:bg-blue-500/10
                               hover:text-blue-300 transition">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         class="h-4 w-4">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/>
                    </svg>

                    Editar
                </button>

                <!-- Remover -->
                <button type="button"
                        th:hx-delete="@{/comentarios/{codigo}(codigo=${comentario.codigo})}"
                        title="Remover comentário"
                        class="inline-flex items-center gap-1.5 rounded-lg
                               px-2.5 py-1.5 text-xs font-medium
                               text-red-400 hover:bg-red-500/10
                               hover:text-red-300 transition">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         class="h-4 w-4">
                        <path d="M3 6h18"/>
                        <path d="M8 6V4h8v2"/>
                        <path d="m19 6-1 14H6L5 6"/>
                        <path d="M10 11v5"/>
                        <path d="M14 11v5"/>
                    </svg>

                    Remover
                </button>

            </div>

        </div>

        <!-- Modo de visualização -->
        <p x-show="!editando"
           x-cloak
           class="mt-2 text-sm text-slate-400 leading-relaxed
                  whitespace-pre-line break-words"
           th:text="${comentario.comentario}">
        </p>

        <!-- Modo de edição -->
        <form x-show="editando"
            x-cloak
            th:hx-put="@{/comentarios/{codigo}(codigo=${comentario.codigo})}"
            th:attr="hx-target=|#comentario-${comentario.codigo}|"
            hx-swap="outerHTML"
            class="mt-4 space-y-4">

            <!-- Texto original -->
            <div class="rounded-lg border border-slate-700
                        bg-slate-800/60 p-4">

                <div class="flex items-center gap-2 mb-2">

                    <svg xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="h-4 w-4 text-slate-400">
                        <path d="M8 6h13"/>
                        <path d="M8 12h13"/>
                        <path d="M8 18h13"/>
                        <path d="M3 6h.01"/>
                        <path d="M3 12h.01"/>
                        <path d="M3 18h.01"/>
                    </svg>

                    <span class="text-xs font-semibold text-slate-400">
                        Comentário atual
                    </span>
                </div>

                <p x-text="textoOriginal"
                class="text-sm text-slate-300 leading-relaxed
                        whitespace-pre-line break-words">
                </p>

            </div>

            <!-- Campo de edição -->
            <div class="space-y-2">

                <label class="block text-xs font-medium text-slate-300">
                    Novo comentário
                </label>

                <textarea name="comentario"
                        x-model="texto"
                        th:text="${comentario.comentario}"
                        rows="4"
                        required
                        maxlength="2000"
                        placeholder="Digite o novo comentário..."
                        class="taskflow-form-control block w-full px-4 py-3
                                text-sm text-white bg-[#172235]
                                border border-slate-600 rounded-lg
                                focus:border-blue-500 focus:ring-blue-500
                                placeholder:text-slate-500 resize-y"
                        style="background-color: #172235 !important;
                                color: #ffffff !important;
                                color-scheme: dark;">
                </textarea>

            </div>

            <!-- Ações -->
            <div class="flex justify-end items-center gap-3 pt-1">

                <!-- Cancelar -->
                <button type="button"
                        @click="cancelar()"
                        class="inline-flex items-center justify-center gap-2
                            rounded-lg border border-slate-600
                            px-4 py-2.5 text-xs font-medium
                            text-slate-300 hover:bg-slate-700/60
                            hover:text-white transition">

                    Cancelar
                </button>

                <!-- Salvar -->
                <button type="submit"
                        :disabled="!texto.trim() || texto.trim() === textoOriginal.trim()"
                        class="inline-flex items-center justify-center gap-2
                            rounded-lg bg-blue-600 px-4 py-2.5
                            text-xs font-medium text-white
                            hover:bg-blue-500 transition
                            disabled:opacity-40 disabled:cursor-not-allowed">

                    <svg xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="h-4 w-4">
                        <path d="M20 6 9 17l-5-5"/>
                    </svg>

                    Salvar alterações
                </button>

            </div>

        </form>

    </div>

</li>

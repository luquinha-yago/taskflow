<th:block th:fragment="card(tarefa)" xmlns:th="http://www.thymeleaf.org">

    <a th:href="@{/tarefas/{codigo}(codigo=${tarefa.codigo})}"
       th:with="atrasada=${tarefa.dataPrazo != null
                    and tarefa.statusTarefa.name() != 'FEITO'
                    and tarefa.dataPrazo.isBefore(#temporals.createToday())}"
       title="Abrir tarefa"
       class="group block rounded-lg border border-slate-700
              bg-slate-800/60 p-4 transition-all duration-200
              hover:-translate-y-0.5 hover:border-blue-500/50
              hover:bg-slate-800">

        <!-- Código e prioridade -->
        <div class="flex items-center justify-between gap-2">

            <p class="text-xs font-medium text-slate-500"
               th:text="${'TAREFA #' + tarefa.codigo}">
            </p>

            <span class="taskflow-prioridade taskflow-prioridade-card"
                  th:classappend="${tarefa.prioridade.name() == 'BAIXA' ? 'taskflow-prioridade-baixa' :
                                   tarefa.prioridade.name() == 'MEDIA' ? 'taskflow-prioridade-media' :
                                   'taskflow-prioridade-alta'}"
                  th:text="${tarefa.prioridade.descricao}">
            </span>

        </div>

        <!-- Título -->
        <h4 class="mt-2 text-sm font-semibold text-white line-clamp-2
                   group-hover:text-blue-300 transition"
            th:text="${tarefa.titulo}">
        </h4>

        <!-- Descrição -->
        <p th:if="${tarefa.descricao != null and !tarefa.descricao.isBlank()}"
           class="mt-1 text-xs text-slate-400 leading-relaxed line-clamp-2"
           th:text="${tarefa.descricao}">
        </p>

        <!-- Rodapé: responsável e prazo -->
        <div class="mt-4 flex items-center justify-between gap-2
                    border-t border-slate-700/70 pt-3 text-xs">

            <!-- Responsável -->
            <div class="flex items-center gap-2 min-w-0">

                <span th:if="${tarefa.nomeFuncionarioResponsavel != null
                              and !tarefa.nomeFuncionarioResponsavel.isBlank()}"
                      class="flex h-6 w-6 shrink-0 items-center justify-center
                             rounded-full bg-blue-500/15 text-[10px]
                             font-semibold text-blue-300"
                      th:text="${#strings.toUpperCase(#strings.substring(tarefa.nomeFuncionarioResponsavel, 0, 1))}">
                </span>

                <span class="truncate"
                      th:classappend="${tarefa.nomeFuncionarioResponsavel != null ? 'text-slate-300' : 'text-slate-500 italic'}"
                      th:text="${tarefa.nomeFuncionarioResponsavel != null
                                 ? tarefa.nomeFuncionarioResponsavel
                                 : 'Sem responsável'}">
                </span>

            </div>

            <!-- Prazo -->
            <div th:if="${tarefa.dataPrazo != null}"
                 class="flex shrink-0 items-center gap-1"
                 th:classappend="${atrasada ? 'text-red-400' : 'text-slate-400'}"
                 th:title="${atrasada ? 'Tarefa atrasada' : 'Prazo da tarefa'}">

                <svg xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     class="h-3.5 w-3.5">
                    <rect x="3" y="5" width="18" height="16" rx="2"/>
                    <path d="M16 3v4M8 3v4M3 11h18"/>
                </svg>

                <span th:text="${#temporals.format(tarefa.dataPrazo, 'dd/MM')}"></span>

            </div>

        </div>

    </a>

</th:block>

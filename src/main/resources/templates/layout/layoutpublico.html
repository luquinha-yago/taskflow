<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">
        Taskflow
    </title>

    <link rel="shortcut icon" th:href="@{/images/logo.png}" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}" />

    <!-- Biblioteca HTMX -->
    <script defer th:src="@{/js/vendors/htmx/htmx.min.js}"></script>

    <meta name="htmx-config" content='{"defaultSwap":"outerHTML"}' />

    <!-- CSRF -->
    <meta name="_csrf" th:content="${_csrf?.token}" />
    <meta name="_csrf_header" th:content="${_csrf?.headerName}" />

</head>

<body class="min-h-screen bg-[#101827] text-gray-100 antialiased">

    <!-- Container principal -->
    <div class="flex min-h-screen flex-col">

        <!-- Conteúdo da página -->
        <main layout:fragment="conteudo" id="main" class="flex-1">
        </main>

        <!-- Rodapé público -->
        <footer class="border-t border-white/10 bg-[#101827]">
            <div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-4 px-6 py-6 sm:flex-row">

                <!-- Logo e nome -->
                <a th:href="@{/}"
                class="flex items-center gap-3 transition-opacity hover:opacity-80">

                    <img th:src="@{/images/logo.png}"
                        alt="Logo Taskflow"
                        class="h-10 w-10 object-contain md:h-11 md:w-11" />

                    <div class="flex flex-col">
                        <span class="text-xl font-bold tracking-tight text-white md:text-2xl">
                            Task<span class="text-blue-500">flow</span>
                        </span>

                        <span class="hidden text-[10px] font-medium uppercase tracking-[0.2em] text-slate-500 sm:block">
                            Gestão inteligente
                        </span>
                    </div>
                </a>

                <p class="text-center text-xs text-gray-500">
                    © 2026 Taskflow. Todos os direitos reservados.
                </p>

                <span class="text-xs text-gray-500">
                    Organização em cada tarefa.
                </span>

            </div>
        </footer>

    </div>

    <!-- Scripts adicionais -->
    <th:block layout:fragment="scripts"></th:block>

</body>
</html>

<div th:fragment="sidebar"
     xmlns:th="http://www.thymeleaf.org"
     class="hidden w-64 shrink-0 flex-col border-r border-slate-700/70 bg-[#172235] px-4 py-7 md:flex lg:w-72">

    <!-- Identificação da navegação -->
    <div class="mb-7 px-3">
        <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500">
            Menu principal
        </span>
    </div>

    <!-- Opções de navegação -->
    <div class="flex-1">
        <th:block th:replace="~{layout/fragments/menu :: menu}"></th:block>
    </div>

    <!-- Rodapé da sidebar -->
    <div class="mt-8 border-t border-slate-700/70 px-3 pt-5">
        <div class="flex items-center gap-2 text-xs text-slate-500">
            <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
            <span>Plataforma ativa</span>
        </div>

        <p class="mt-2 text-[11px] text-slate-600">
            Taskflow · Gestão de tarefas
        </p>
    </div>

</div>

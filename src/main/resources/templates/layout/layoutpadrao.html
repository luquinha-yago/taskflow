<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />

    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Taskflow</title>

    <link rel="shortcut icon" th:href="@{/images/logo.png}" />

    <!-- Estilo Principal -->
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}" />

    <!-- Fonte -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css?family=Roboto:regular,bold,italic,thin,light,bolditalic,black,medium&amp;lang=en" />

    <!-- Estilo do MDDateTimePicker -->
    <link rel="stylesheet" type="text/css"
          th:href="@{/css/vendors/mddatetimepicker/mdDateTimePicker.min.css}" />

    <!-- Estilo do MCDatepicker -->
    <link rel="stylesheet" type="text/css"
          th:href="@{/css/vendors/mcdatepicker/mc-calendar.min.css}" />

    <!-- Estilo do SweetAlert2 -->
    <link rel="stylesheet" type="text/css"
          th:href="@{/css/vendors/sweetalert2/sweetalert2.min.css}" />

    <!-- Biblioteca Alpine.js -->
    <script defer th:src="@{/js/vendors/alpinejs/cdn.min.js}"></script>

    <!-- Controle do Menu -->
    <script th:src="@{/js/scriptmenus.js}" defer></script>

    <!-- Biblioteca HTMX -->
    <script defer th:src="@{/js/vendors/htmx/htmx.min.js}"></script>

    <meta name="htmx-config" content='{"defaultSwap":"outerHTML"}' />

    <!-- Biblioteca SimpleMaskMoney -->
    <script th:src="@{/js/vendors/maskmoney/simple-mask-money.umd.min.js}" defer></script>

    <!-- Biblioteca MCDatepicker -->
    <script th:src="@{/js/vendors/mcdatepicker/mc-calendar.min.js}" defer></script>

    <!-- Biblioteca MDDateTimePicker -->
    <script th:src="@{/js/vendors/mddatetimepicker/draggabilly.pkgd.min.js}" defer></script>
    <script th:src="@{/js/vendors/mddatetimepicker/moment.min.js}" defer></script>
    <script th:src="@{/js/vendors/mddatetimepicker/mdDateTimePicker.js}" defer></script>

    <!-- Biblioteca SweetAlert2 -->
    <script th:src="@{/js/vendors/sweetalert2/sweetalert2.all.min.js}" defer></script>

    <!-- Aplicação Principal -->
    <script th:src="@{/js/app.js}" defer></script>

    <!-- Tokens CSRF -->
    <meta name="_csrf" th:content="${_csrf?.token}" />
    <meta name="_csrf_header" th:content="${_csrf?.headerName}" />
</head>

<body class="min-h-screen min-w-full overflow-x-hidden bg-[#101827] text-slate-100 antialiased"
      hx-target:inherited="#main"
      hx-status:inherited:4xx="target:#main"
      hx-status:inherited:5xx="target:#main">

    <!-- Estrutura principal da aplicação -->
    <div class="flex min-h-screen min-w-full flex-col">

        <!-- Cabeçalho permanente -->
        <header th:replace="~{layout/fragments/header :: header}"></header>

        <!-- Área de navegação e conteúdo -->
        <section class="flex min-h-0 flex-1">

            <!-- Menu lateral permanente -->
            <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>

            <!-- Conteúdo substituído pelas navegações HTMX -->
            <th:block layout:fragment="conteudo"></th:block>

        </section>

        <!-- Rodapé permanente -->
        <footer th:replace="~{layout/fragments/rodape :: rodape}"></footer>

    </div>

    <!-- Scripts específicos de cada página -->
    <th:block layout:fragment="scripts"></th:block>

</body>
</html>

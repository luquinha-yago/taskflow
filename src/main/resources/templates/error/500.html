<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layoutpadrao}">

<head>
    <title>Erro interno</title>
</head>

<body>

<main layout:fragment="conteudo"
      th:fragment="conteudo"
      id="main"
      class="flex min-h-[75vh] w-full flex-col items-center justify-center px-6 py-12">

    <div class="w-full max-w-2xl text-center">

        <!-- Ilustração -->
        <div class="mb-8 flex justify-center">
            <img th:src="@{/images/500.png}"
                 class="max-h-64 w-auto object-contain"
                 alt="Erro interno do servidor" />
        </div>

        <span class="inline-flex items-center rounded-full border border-red-400/20 bg-red-400/10 px-4 py-2 text-xs font-semibold uppercase tracking-wider text-red-400">
            Erro 500 · Erro interno
        </span>

        <h1 class="mt-6 text-3xl font-bold tracking-tight text-white sm:text-4xl">
            Tivemos um problema no servidor
        </h1>

        <p class="mx-auto mt-4 max-w-lg text-base leading-7 text-gray-400">
            Não foi possível concluir sua solicitação neste momento.
            Nossa aplicação encontrou um problema inesperado.
            Tente novamente em alguns instantes.
        </p>

        <!-- Ações -->
        <div class="mt-9 flex flex-col justify-center gap-3 sm:flex-row">

            <a th:href="@{/}"
               class="inline-flex items-center justify-center gap-2 rounded-lg bg-blue-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-blue-500">

                <svg xmlns="http://www.w3.org/2000/svg"
                     class="h-5 w-5"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="2">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-6h6v6"/>
                </svg>

                Voltar ao início
            </a>

            <button type="button"
                    onclick="window.location.reload()"
                    class="inline-flex items-center justify-center rounded-lg border border-white/10 px-6 py-3 text-sm font-semibold text-gray-300 transition hover:border-blue-400/40 hover:bg-white/5 hover:text-white">

                Tentar novamente
            </button>

        </div>

    </div>

</main>

</body>
</html>

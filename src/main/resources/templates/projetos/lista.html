
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.thymeleaf.org"
      layout:decorate="~{layout/layoutpadrao}">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projetos</title>
</head>

<body>

<main layout:fragment="conteudo"
      th:fragment="conteudo"
      id="main"
      class="flex flex-col w-full p-6 md:p-10">

    <!-- Cabeçalho -->
    <div th:replace="~{components/cabecalho-pagina :: cabecalho(
        'Projetos',
        'Organize, acompanhe e gerencie os projetos da sua empresa.',
        null
    )}"></div>

    <!-- Pesquisa -->
    <form th:hx-get="@{/projetos}"
          th:object="${projetoSearchRequest}"
          class="w-full mb-8">

        <div class="grid grid-cols-1 md:grid-cols-3 xl:grid-cols-4 gap-5">

            <!-- Nome -->
            <div>
                <div th:replace="~{components/forms :: inputTexto(
                    textoLabel='Nome do projeto',
                    nomeAtributo='nome',
                    valorAtributo=*{nome})}">
                </div>
            </div>

            <!-- Departamento -->
            <div th:replace="~{components/forms :: inputBuscavel(
                textoLabel='Departamento',
                nomeAtributo='codigoDepartamento',
                valorAtributo=*{codigoDepartamento},
                nomeAtributoTexto='nomeDepartamento',
                valorAtributoTexto=*{nomeDepartamento},
                urlBusca='/projetos/pesquisardepartamento',
                placeholderBusca='Digite ao menos 3 letras...',
                isValidado=true)}">
            </div>

            <!-- Data criação inicial -->
            <div>
                <div th:replace="~{components/forms :: inputData(
                    textoLabel='Data de Criação Inicial',
                    nomeAtributo='dataCriacaoInicial',
                    valorAtributo=*{dataCriacaoInicial})}">
                </div>
            </div>

            <!-- Data criação final -->
            <div>
                <div th:replace="~{components/forms :: inputData(
                    textoLabel='Data de Criação Final',
                    nomeAtributo='dataCriacaoFinal',
                    valorAtributo=*{dataCriacaoFinal})}">
                </div>
            </div>

            <!-- Data conclusão inicial -->
            <div>
                <div th:replace="~{components/forms :: inputData(
                    textoLabel='Conclusão inicial',
                    nomeAtributo='dataConclusaoInicial',
                    valorAtributo=*{dataConclusaoInicial})}">
                </div>
            </div>

            <!-- Data conclusão final -->
            <div>
                <div th:replace="~{components/forms :: inputData(
                    textoLabel='Conclusão final',
                    nomeAtributo='dataConclusaoFinal',
                    valorAtributo=*{dataConclusaoFinal})}">
                </div>
            </div>

            <!-- Status do projeto -->
            <div th:replace="~{components/forms :: selectNormal(
                textoLabel='Situação do projeto',
                nomeAtributo='statusProjeto',
                listaOpcoes=${statusProjetos},
                propValue='valor',
                propLabel='descricao',
                textoPlaceholder='Todas as situações',
                isValidado=true
            )}"></div>
            

            <!-- Prioridade -->
            <div>
                <div th:replace="~{components/forms :: selectNormal(
                    textoLabel='Prioridade',
                    nomeAtributo='prioridade',
                    listaOpcoes=${prioridades},
                    propValue='valor',
                    propLabel='descricao',
                    textoPlaceholder='Todas as prioridades',
                    isValidado=true
                )}"></div>
            </div>

        </div>

        <button type="submit"
                class="mt-5 inline-flex items-center gap-2 px-5 py-3
                       rounded-lg bg-blue-600 text-white font-medium
                       hover:bg-blue-500 transition">

            <svg xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 class="h-4 w-4">
                <circle cx="11" cy="11" r="7"/>
                <path d="m20 20-4-4"/>
            </svg>

            Pesquisar projetos
        </button>

    </form>

    <!-- Listagem de projetos -->
    <div th:if="${not pagina.vazia}"
         class="w-full">

        <!-- Informações da listagem -->
        <div class="flex flex-col sm:flex-row sm:items-center
                    justify-between gap-3 mb-5">

            <div>
                <h2 class="text-lg font-semibold text-white">
                    Projetos cadastrados
                </h2>

                <p class="text-sm text-slate-400 mt-1">
                    Selecione um projeto para visualizar seus detalhes.
                </p>
            </div>

            <span class="text-sm text-slate-400"
                  th:text="${pagina.totalElementos + ' projeto(s) encontrado(s)'}">
            </span>

        </div>

        <!-- Grid de cards -->
        <div class="taskflow-projetos-grid">

            <article th:each="projeto : ${pagina.conteudo}"
                     class="group relative flex flex-col overflow-hidden
                            rounded-2xl border border-slate-700/80
                            bg-slate-900 shadow-lg shadow-black/10
                            transition-all duration-300
                            hover:-translate-y-1 hover:border-blue-500/50
                            hover:shadow-xl hover:shadow-blue-950/20">

                <!-- Faixa superior -->
                <div class="h-1 w-full"
                     th:classappend="${projeto.statusProjeto.name() == 'PLANEJADO' ? 'bg-slate-500' :
                                      projeto.statusProjeto.name() == 'EM_ANDAMENTO' ? 'bg-blue-500' :
                                      projeto.statusProjeto.name() == 'CONCLUIDO' ? 'bg-emerald-500' :
                                      'bg-red-500'}">
                </div>

                <div class="flex flex-col flex-1 p-5">

                    
                <!-- Cabeçalho do card -->
                <div class="flex items-start justify-between gap-3">

                    <div class="flex items-center gap-3 min-w-0">

                        <div class="flex h-11 w-11 shrink-0 items-center
                                    justify-center rounded-xl
                                    bg-blue-500/10 text-blue-400
                                    border border-blue-500/20">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="h-5 w-5">
                                <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            </svg>

                        </div>

                        <div class="min-w-0">

                            <p class="text-xs text-slate-500 font-medium"
                            th:text="${'PROJETO #' + projeto.codigo}">
                            </p>

                            <h3 class="text-base font-semibold text-white truncate mt-1"
                                th:text="${projeto.nome}">
                            </h3>

                        </div>

                    </div>

                    <!-- Situação e ações -->
                    <div class="flex items-center gap-2 shrink-0 flex-wrap justify-end">

                        <!-- Situação -->
                        <span class="taskflow-status"
                            th:classappend="${projeto.statusProjeto.name() == 'PLANEJADO' ? 'taskflow-status-planejado' :
                                            projeto.statusProjeto.name() == 'EM_ANDAMENTO' ? 'taskflow-status-andamento' :
                                            projeto.statusProjeto.name() == 'CONCLUIDO' ? 'taskflow-status-concluido' :
                                            'taskflow-status-cancelado'}"
                            th:text="${projeto.statusProjeto.descricao}">
                        </span>

                        <!-- Editar -->
                        <a th:href="@{/projetos/{codigo}/editar(codigo=${projeto.codigo})}"
                        title="Editar projeto"
                        aria-label="Editar projeto"
                        class="inline-flex h-9 w-9 items-center justify-center
                                rounded-lg border border-slate-700
                                bg-slate-800/70 text-slate-400
                                transition hover:border-blue-500/40
                                hover:bg-blue-500/10 hover:text-blue-400">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="h-4 w-4">
                                <path d="M12 20h9"/>
                                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/>
                            </svg>

                        </a>

                        <!-- Excluir -->
                        <button type="button"
                                th:attr="hx-delete=@{/projetos/{codigo}(codigo=${projeto.codigo})}"
                                hx-confirm="Tem certeza que deseja excluir este projeto?"
                                hx-target="#main"
                                hx-swap="outerHTML"
                                title="Excluir projeto"
                                aria-label="Excluir projeto"
                                class="inline-flex h-9 w-9 items-center justify-center
                                    rounded-lg border border-slate-700
                                    bg-slate-800/70 text-slate-400
                                    transition hover:border-red-500/40
                                    hover:bg-red-500/10 hover:text-red-400">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="h-4 w-4">
                                <path d="M3 6h18"/>
                                <path d="M8 6V4h8v2"/>
                                <path d="m19 6-1 14H6L5 6"/>
                                <path d="M10 11v5M14 11v5"/>
                            </svg>

                        </button>

                    </div>

                </div>


                    <!-- Descrição -->
                    <p class="mt-5 text-sm text-slate-400 leading-relaxed
                              line-clamp-2 min-h-10"
                       th:text="${projeto.descricao != null and !projeto.descricao.isBlank()
                                  ? projeto.descricao
                                  : 'Nenhuma descrição informada.'}">
                    </p>

                    <!-- Departamento -->
                    <div class="flex items-center gap-2 mt-4
                                text-sm text-slate-400">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="1.8"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             class="h-4 w-4 shrink-0 text-slate-500">
                            <path d="M3 21h18"/>
                            <path d="M5 21V7l8-4v18"/>
                            <path d="M19 21V11l-6-4"/>
                            <path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/>
                        </svg>

                        <span class="truncate"
                              th:text="${projeto.nomeDepartamento != null
                                         ? projeto.nomeDepartamento
                                         : 'Sem departamento associado'}">
                        </span>

                    </div>

                    <!-- Prioridade -->
                    <div class="mt-5">
                        <span class="taskflow-prioridade"
                            th:classappend="${projeto.prioridade.name() == 'BAIXA' ? 'taskflow-prioridade-baixa' :
                                            projeto.prioridade.name() == 'MEDIA' ? 'taskflow-prioridade-media' :
                                            'taskflow-prioridade-alta'}"
                            th:text="${'Prioridade ' + projeto.prioridade.descricao}">
                        </span>
                    </div>

                    <!-- Datas -->
                    <div class="grid grid-cols-2 gap-4 mt-5
                                rounded-xl bg-slate-800/60 p-4">

                        <div>
                            <p class="text-xs text-slate-500 mb-1">
                                Data de início
                            </p>

                            <p class="text-sm font-medium text-slate-200"
                               th:text="${projeto.dataInicio != null
                                   ? #temporals.format(projeto.dataInicio, 'dd/MM/yyyy')
                                   : 'Não definida'}">
                            </p>
                        </div>

                        <div>
                            <p class="text-xs text-slate-500 mb-1">
                                Data de término
                            </p>

                            <p class="text-sm font-medium text-slate-200"
                               th:text="${projeto.dataFim != null
                                   ? #temporals.format(projeto.dataFim, 'dd/MM/yyyy')
                                   : 'Não definida'}">
                            </p>
                        </div>

                    </div>

                    <!-- Data de conclusão -->
                    <div th:if="${projeto.dataConclusao != null}"
                         class="flex items-center gap-2 mt-3 text-xs
                                text-emerald-400">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="1.8"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             class="h-4 w-4">
                            <circle cx="12" cy="12" r="9"/>
                            <path d="m8 12 2.5 2.5L16 9"/>
                        </svg>

                        <span th:text="${'Concluído em ' +
                            #temporals.format(projeto.dataConclusao, 'dd/MM/yyyy')}">
                        </span>

                    </div>

                    <!-- Rodapé do card -->
                    <div class="mt-auto pt-5">

                        <div class="border-t border-slate-800 pt-4">

                            <a th:href="@{/projetos/{codigo}(codigo=${projeto.codigo})}"
                               class="flex w-full items-center justify-center
                                      gap-2 rounded-xl bg-blue-600/10
                                      border border-blue-500/20
                                      px-4 py-3 text-sm font-semibold
                                      text-blue-400 transition-all
                                      hover:bg-blue-600 hover:text-white
                                      hover:border-blue-600">

                                <svg xmlns="http://www.w3.org/2000/svg"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="1.8"
                                     stroke-linecap="round"
                                     stroke-linejoin="round"
                                     class="h-4 w-4">
                                    <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                                    <path d="M10 13h5"/>
                                    <path d="m13 10 3 3-3 3"/>
                                </svg>

                                Acessar projeto

                            </a>

                        </div>

                    </div>

                </div>

            </article>

        </div>

        <!-- Paginação -->
        <div th:replace="~{components/paginacao :: paginacao(${pagina})}">
        </div>

    </div>

    <!-- Estado vazio -->
    <div th:if="${pagina.vazia}"
         class="flex flex-col items-center justify-center
                py-16 px-6 border border-dashed border-slate-700
                rounded-2xl bg-slate-900/40">

        <div class="flex h-16 w-16 items-center justify-center
                    rounded-2xl bg-slate-800 text-slate-400 mb-5">

            <svg xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.5"
                 class="h-8 w-8">
                <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>

        </div>

        <h3 class="text-lg font-semibold text-white">
            Nenhum projeto encontrado
        </h3>

        <p class="mt-2 text-sm text-slate-400 text-center max-w-md">
            Não existem projetos cadastrados ou correspondentes
            aos filtros informados.
        </p>

        <a th:href="@{/projetos/cadastrar}"
           class="inline-flex items-center gap-2 mt-6 px-5 py-3
                  rounded-xl bg-blue-600 text-white text-sm
                  font-medium hover:bg-blue-500 transition">

            <svg id="cadastrar-projeto-icon"
                th:fragment="cadastrar-projeto-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="h-5 w-5">
                <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <path d="M12 11v6"/>
                <path d="M9 14h6"/>
            </svg>


            Cadastrar primeiro projeto
        </a>
        
    </div>

</main>

</body>
</html>

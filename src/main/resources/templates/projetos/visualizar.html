<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layoutpadrao}">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Projeto</title>
</head>

<body>

<main layout:fragment="conteudo"
      th:fragment="conteudo"
      id="main"
      class="flex flex-col w-full min-h-full p-6 md:p-8 gap-6">

    <!-- Cabeçalho do projeto -->
    <section class="flex flex-col gap-5">

        <div class="flex flex-col sm:flex-row sm:items-center
                    justify-between gap-4">

            <div class="flex items-start gap-3">

                <a th:href="@{/projetos}"
                   title="Voltar para projetos"
                   class="flex h-10 w-10 shrink-0 items-center
                          justify-center rounded-xl border
                          border-slate-700 bg-slate-800
                          text-slate-300 hover:text-white
                          hover:bg-slate-700 transition">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         class="h-5 w-5">
                        <path d="m15 18-6-6 6-6"/>
                    </svg>

                </a>

                <div class="min-w-0">

                    <p class="text-xs font-semibold uppercase
                              tracking-wider text-blue-400"
                       th:text="${'PROJETO #' + projeto.codigo}">
                    </p>

                    <h1 class="text-2xl font-bold text-white mt-1"
                        th:text="${projeto.nome}">
                    </h1>

                    <p class="text-sm text-slate-400 mt-1"
                       th:text="${projeto.descricao != null
                           and !projeto.descricao.isBlank()
                           ? projeto.descricao
                           : 'Nenhuma descrição informada.'}">
                    </p>

                </div>

            </div>

            <div class="flex items-center gap-2">

                <a th:href="@{/projetos/{codigo}/editar(codigo=${projeto.codigo})}"
                   class="inline-flex items-center gap-2 rounded-lg
                          border border-slate-700 bg-slate-800
                          px-4 py-2.5 text-sm font-medium
                          text-slate-200 hover:bg-slate-700
                          transition">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         class="h-4 w-4">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/>
                    </svg>

                    Editar projeto
                </a>

            </div>

        </div>

        <!-- Informações resumidas -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

            <div class="rounded-xl border border-slate-700/80
                        bg-slate-900 p-4">

                <p class="text-xs text-slate-500">Departamento</p>

                <p class="text-sm font-semibold text-slate-200 mt-2"
                   th:text="${projeto.nomeDepartamento != null
                       ? projeto.nomeDepartamento
                       : 'Não associado'}">
                </p>

            </div>

            <div class="rounded-xl border border-slate-700/80
                        bg-slate-900 p-4">

                <p class="text-xs text-slate-500">Data de início</p>

                <p class="text-sm font-semibold text-slate-200 mt-2"
                   th:text="${projeto.dataInicio != null
                       ? #temporals.format(projeto.dataInicio, 'dd/MM/yyyy')
                       : 'Não definida'}">
                </p>

            </div>

            <div class="rounded-xl border border-slate-700/80
                        bg-slate-900 p-4">

                <p class="text-xs text-slate-500">Data de término</p>

                <p class="text-sm font-semibold text-slate-200 mt-2"
                   th:text="${projeto.dataFim != null
                       ? #temporals.format(projeto.dataFim, 'dd/MM/yyyy')
                       : 'Não definida'}">
                </p>

            </div>

        </div>

    </section>

    <!-- Cabeçalho do Kanban -->
    <section class="flex flex-col gap-1">

        <div class="flex items-center justify-between gap-3">

            <h2 class="text-lg font-bold text-white">
                Quadro de tarefas
            </h2>

            <span class="text-xs text-slate-500"
                  th:text="${pagina.totalElementos + ' tarefa(s) no projeto'}">
            </span>

        </div>

        <p class="text-sm text-slate-400">
            Acompanhe o andamento das atividades deste projeto.
            Clique em uma tarefa para ver os detalhes e os comentários.
        </p>

    </section>

    <!-- Pesquisa de tarefas -->
    <form th:hx-get="@{/projetos/{codigo}(codigo=${projeto.codigo})}"
          th:object="${tarefaSearchRequest}"
          class="w-full rounded-xl border border-slate-700/80
                 bg-slate-900 p-4">

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-x-5">

            <!-- Título -->
            <div>
                <div th:replace="~{components/forms :: inputTexto(
                    textoLabel='Título da tarefa',
                    nomeAtributo='titulo',
                    valorAtributo=*{titulo})}">
                </div>
            </div>

            <!-- Responsável -->
            <div th:replace="~{components/forms :: inputBuscavel(
                textoLabel='Responsável',
                nomeAtributo='codigoFuncionarioResponsavel',
                valorAtributo=*{codigoFuncionarioResponsavel},
                nomeAtributoTexto='nomeFuncionarioResponsavel',
                valorAtributoTexto=*{nomeFuncionarioResponsavel},
                urlBusca='/tarefas/pesquisarfuncionario',
                placeholderBusca='Digite ao menos 3 letras...',
                isValidado=true)}">
            </div>

            <!-- Prazo inicial -->
            <div>
                <div th:replace="~{components/forms :: inputData(
                    textoLabel='Prazo inicial',
                    nomeAtributo='dataPrazoInicial',
                    valorAtributo=*{dataPrazoInicial})}">
                </div>
            </div>

            <!-- Prazo final -->
            <div>
                <div th:replace="~{components/forms :: inputData(
                    textoLabel='Prazo final',
                    nomeAtributo='dataPrazoFinal',
                    valorAtributo=*{dataPrazoFinal})}">
                </div>
            </div>

            <!-- Prioridade -->
            <div class="mt-6">
                <div th:replace="~{components/forms :: selectNormal(
                    textoLabel='Prioridade',
                    nomeAtributo='prioridade',
                    listaOpcoes=${prioridades},
                    propValue='valor',
                    propLabel='descricao',
                    textoPlaceholder='Todas as prioridades',
                    isValidado=true
                )}"></div>
            </div>

        </div>

        <button type="submit"
                class="mt-5 inline-flex items-center gap-2 px-5 py-3
                       rounded-lg bg-blue-600 text-white font-medium
                       hover:bg-blue-500 transition">

            <svg xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 class="h-4 w-4">
                <circle cx="11" cy="11" r="7"/>
                <path d="m20 20-4-4"/>
            </svg>

            Pesquisar tarefas
        </button>

    </form>

    <!-- Quadro Kanban: uma raia para cada situação da tarefa -->
    <section class="grid grid-cols-1 sm:grid-cols-2
                    xl:grid-cols-4 gap-4 items-start">

        <div th:each="situacao : ${statusTarefas}"
             th:with="tarefasRaia=${pagina.conteudo.?[statusTarefa.name() == '__${situacao.name()}__']},
                      corPonto=${situacao.name() == 'A_FAZER' ? 'bg-slate-400' :
                                 situacao.name() == 'FAZENDO' ? 'bg-blue-400' :
                                 situacao.name() == 'EM_REVISAO' ? 'bg-amber-400' :
                                 'bg-emerald-400'},
                      corContador=${situacao.name() == 'A_FAZER' ? 'bg-slate-700 text-slate-300' :
                                    situacao.name() == 'FAZENDO' ? 'bg-blue-500/10 text-blue-400' :
                                    situacao.name() == 'EM_REVISAO' ? 'bg-amber-500/10 text-amber-400' :
                                    'bg-emerald-500/10 text-emerald-400'}"
             class="flex flex-col min-w-0 overflow-hidden
                    rounded-xl border border-slate-700
                    bg-slate-900">

            <!-- Cabeçalho da raia -->
            <div class="flex items-center justify-between
                        gap-2 border-b border-slate-700
                        bg-slate-800/60 p-4">

                <div class="flex items-center gap-2">

                    <span class="h-2.5 w-2.5 rounded-full"
                          th:classappend="${corPonto}"></span>

                    <h3 class="font-semibold text-slate-200"
                        th:text="${situacao.descricao}">
                    </h3>

                    <span class="rounded-md px-2 py-0.5 text-xs"
                          th:classappend="${corContador}"
                          th:text="${#lists.size(tarefasRaia)}">
                    </span>

                </div>

                <!-- Nova tarefa nesta raia -->
                <a th:href="@{/tarefas/cadastrar(codigoProjeto=${projeto.codigo}, statusTarefa=${situacao.name()})}"
                   th:title="${'Nova tarefa em ' + situacao.descricao}"
                   th:aria-label="${'Nova tarefa em ' + situacao.descricao}"
                   class="flex h-8 w-8 items-center
                          justify-center rounded-lg
                          text-slate-400 hover:bg-slate-700
                          hover:text-white transition">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         class="h-5 w-5">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>

                </a>

            </div>

            <!-- Cards da raia -->
            <div class="flex flex-col gap-3 p-3
                        min-h-64 max-h-[600px]
                        overflow-y-auto">

                <th:block th:each="tarefa : ${tarefasRaia}">
                    <th:block th:replace="~{tarefas/fragments/tarefa_card :: card(${tarefa})}"></th:block>
                </th:block>

                <!-- Estado vazio -->
                <div th:if="${#lists.isEmpty(tarefasRaia)}"
                     class="flex flex-col items-center
                            justify-center gap-2
                            rounded-lg border border-dashed
                            border-slate-700 p-6 text-center">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.5"
                         class="h-7 w-7 text-slate-600">
                        <path d="M8 6h13M8 12h13M8 18h13"/>
                        <path d="M3 6h.01M3 12h.01M3 18h.01"/>
                    </svg>

                    <p class="text-xs text-slate-500">
                        Nenhuma tarefa nesta raia.
                    </p>

                    <a th:href="@{/tarefas/cadastrar(codigoProjeto=${projeto.codigo}, statusTarefa=${situacao.name()})}"
                       class="text-xs font-medium text-blue-400 hover:text-blue-300">
                        + Adicionar tarefa
                    </a>

                </div>

            </div>

        </div>

    </section>

    <!-- Paginação -->
    <div th:replace="~{components/paginacao :: paginacao(${pagina})}">
    </div>

</main>

</body>
</html>

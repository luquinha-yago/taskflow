<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layoutautenticacao}">

<head>
    <title>Entrar</title>
</head>

<body>

<main layout:fragment="conteudo"
      class="flex min-h-screen items-center justify-center px-6 py-12">

    <div class="w-full max-w-md">

        <!-- Identidade visual -->
        <div class="mb-8 text-center">

            <div class="mx-auto mb-4 flex h-16 w-16
                        items-center justify-center rounded-2xl
                        border border-blue-500/20 bg-blue-500/10">

                <svg xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     class="h-8 w-8 text-blue-400">

                    <rect x="3" y="3" width="18" height="18" rx="4"/>
                    <path d="m8 12 2.5 2.5L16 9"/>

                </svg>

            </div>

            <h1 class="text-3xl font-bold tracking-tight text-white">
                Task <span class="text-blue-400">Flow</span>
            </h1>

            <p class="mt-2 text-sm text-slate-400">
                Gestão de tarefas e projetos
            </p>

        </div>

        <!-- Formulário -->
        <section class="rounded-2xl border border-slate-700/80
                        bg-[#172235] p-7 shadow-xl">

            <div class="mb-7">
                <h2 class="text-xl font-semibold text-white">
                    Bem-vindo de volta!
                </h2>

                <p class="mt-1 text-sm text-slate-400">
                    Entre com suas credenciais para acessar o sistema.
                </p>
            </div>

            <!-- Erro de autenticação -->
            <div th:if="${param.error}"
                 class="mb-5 rounded-lg border border-red-500/30
                        bg-red-500/10 p-3 text-sm text-red-400">

                Usuário ou senha inválidos. Verifique suas credenciais.

            </div>

            <!-- Logout -->
            <div th:if="${param.logout}"
                 class="mb-5 rounded-lg border border-green-500/30
                        bg-green-500/10 p-3 text-sm text-green-400">

                Você saiu do sistema com sucesso.

            </div>

            <form th:action="@{/login}"
                  method="post"
                  class="space-y-5">

                <!-- Usuário -->
                <div>

                    <label for="username"
                           class="mb-2 block text-sm font-medium
                                  text-slate-300">
                        Usuário
                    </label>

                    <input type="text"
                           id="username"
                           name="username"
                           autocomplete="username"
                           placeholder="Digite seu usuário"
                           th:value="${username}"
                           required
                           autofocus
                           class="taskflow-form-control block w-full
                                  rounded-lg border border-slate-600
                                  bg-[#101827] px-4 py-3 text-sm
                                  text-white placeholder:text-slate-500
                                  focus:border-blue-500
                                  focus:ring-blue-500">

                </div>

                <!-- Senha -->
                <div>

                    <label for="password"
                           class="mb-2 block text-sm font-medium
                                  text-slate-300">
                        Senha
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           autocomplete="current-password"
                           placeholder="Digite sua senha"
                           required
                           class="taskflow-form-control block w-full
                                  rounded-lg border border-slate-600
                                  bg-[#101827] px-4 py-3 text-sm
                                  text-white placeholder:text-slate-500
                                  focus:border-blue-500
                                  focus:ring-blue-500">

                </div>

                <!-- Entrar -->
                <button type="submit"
                        class="flex w-full items-center
                               justify-center gap-2 rounded-lg
                               bg-blue-600 px-4 py-3 text-sm
                               font-semibold text-white
                               transition hover:bg-blue-500">

                    Entrar

                    <svg xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         class="h-4 w-4">

                        <path d="M5 12h14"/>
                        <path d="m12 5 7 7-7 7"/>

                    </svg>

                </button>

            </form>

        </section>

        <!-- Rodapé simples -->
        <footer class="mt-8 text-center">
            <p class="text-xs text-slate-500">
                Task Flow · Todos os direitos reservados.
            </p>
        </footer>

    </div>

</main>

</body>
</html>

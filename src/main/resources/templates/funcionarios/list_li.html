<th:block th:fragment="lista" xmlns:th="http://www.thymeleaf.org">
    <li th:if="${#lists.isEmpty(funcionarios)}" class="px-4 py-2 text-sm text-slate-400 pointer-events-none">
        Nenhum funcionário encotrado.
    </li>

    <li th:each="funcionario : ${funcionarios}" class="px-4 py-2 text-sm text-slate-200 cursor-pointer hover:bg-slate-700" 
        th:data-value="${funcionario.codigo}" 
        th:data-text="${funcionario.nome}" 
        th:text="${funcionario.nome}">
    </li>
</th:block>

<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.thymeleaf.org"
      layout:decorate="~{layout/layoutpadrao}">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Funcionário</title>
</head>

<body>

    <main layout:fragment="conteudo"
          th:fragment="formulario"
          id="main"
          class="flex flex-col w-full p-6 md:p-10">

        <div th:replace="~{components/cabecalho-pagina :: cabecalho(
            'Cadastrar funcionário',
            'Preencha as informações para adicionar um novo funcionário à empresa.',
            null
        )}"></div>

        <form th:hx-post="@{/funcionarios}"
              th:object="${funcionarioCreateRequest}"
              class="w-full max-w-2xl">

            <div th:replace="~{funcionarios/fragments/funcionario_inputs :: campos}">
            </div>

            <div th:replace="~{components/forms :: inputSenha(
                textoLabel='Senha',
                nomeAtributo='senha',
                isValidado=true)}">
            </div>

            <div class="flex flex-wrap gap-3 mt-8">

                <button type="submit"
                        class="px-5 py-3 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-500 transition">
                    Cadastrar funcionário
                </button>

                <a th:hx-get="@{/funcionarios}"
                   hx-target="#main"
                   hx-push-url="true"
                   class="px-5 py-3 rounded-lg border border-slate-600 text-slate-300 hover:bg-slate-700 transition cursor-pointer">
                    Cancelar
                </a>

            </div>

        </form>

    </main>

</body>
</html>

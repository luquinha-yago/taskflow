<th:block th:fragment="campos">

    <div th:replace="~{components/forms :: inputTexto(
        textoLabel='Nome completo',
        nomeAtributo='nome',
        isValidado=true)}">
    </div>

    <div th:replace="~{components/forms :: inputCpf(
        textoLabel='CPF',
        nomeAtributo='cpf',
        isValidado=true)}">
    </div>

    <div th:replace="~{components/forms :: inputEmail(
        textoLabel='E-mail',
        nomeAtributo='email',
        isValidado=true)}">
    </div>

    <div th:replace="~{components/forms :: inputTexto(
        textoLabel='Telefone',
        nomeAtributo='telefone',
        isValidado=true)}">
    </div>

    <div th:replace="~{components/forms :: inputBuscavel(
        textoLabel='Empresa',
        nomeAtributo='codigoEmpresa',
        valorAtributo=*{codigoEmpresa},
        nomeAtributoTexto='nomeEmpresa',
        valorAtributoTexto=*{nomeEmpresa},
        urlBusca='/funcionarios/pesquisarempresa',
        placeholderBusca='Digite ao menos 3 letras...',
        isValidado=true)}">
    </div>

    <div th:replace="~{components/forms :: inputBuscavel(
        textoLabel='Departamento',
        nomeAtributo='codigoDepartamento',
        valorAtributo=*{codigoDepartamento},
        nomeAtributoTexto='nomeDepartamento',
        valorAtributoTexto=*{nomeDepartamento},
        urlBusca='/funcionarios/pesquisardepartamento',
        placeholderBusca='Digite ao menos 3 letras...',
        isValidado=true)}">
    </div>

    <div th:replace="~{components/forms :: inputTexto(
        textoLabel='Cargo',
        nomeAtributo='cargo',
        isValidado=true)}">
    </div>

    <div th:replace="~{components/forms :: inputData(
        textoLabel='Data de admissão',
        nomeAtributo='dataAdmissao',
        isValidado=true)}">
    </div>

</th:block>

<!--
  PADRÃO VISUAL DOS CAMPOS
  - Fundo: preto (bg-[#172235])
  - Texto digitado: branco (text-white)
  - Placeholder: cinza claro (placeholder:text-slate-400)
  - Ícones opcionais: passe um fragmento Thymeleaf pelo parâmetro "icone".

  EXEMPLOS DE USO (ícones padrão):
  <div th:replace="~{components/forms :: inputTexto(
      textoLabel='Nome completo', nomeAtributo='nome',
      valorAtributo=${valor}, icone=~{components/forms :: iconeUsuario}
  )}"></div>

  <div th:replace="~{components/forms :: inputEmail(
      textoLabel='E-mail', nomeAtributo='email',
      valorAtributo=${valor}, icone=~{components/forms :: iconeEmail}
  )}"></div>

  Para não exibir ícone, basta não informar o parâmetro "icone".
  Os fragmentos abaixo são os ícones padrão disponíveis.
-->

<th:block th:fragment="inputTexto" th:with="
    disabledFlag=${isDisabled != null and isDisabled},
    validFlag=${isValidado != null and isValidado}" xmlns:th="http://www.thymeleaf.org">

  <label th:for="${nomeAtributo}" th:text="${textoLabel}"
    class="block text-slate-200 font-medium mb-2 mt-6">Label</label>

  <th:block th:if="${validFlag}">
    <div class="relative" th:with="temErro=${#fields.hasErrors('__${nomeAtributo}__')}">
      <th:block th:if="${icone != null}">
        <span class="pointer-events-none absolute inset-y-0 left-0 z-10 flex items-center pl-3 text-slate-400">
          <th:block th:replace="${icone}"></th:block>
        </span>
      </th:block>
<input type="text" th:field="*{__${nomeAtributo}__}" th:disabled="${disabledFlag}" autocomplete="off"
        th:class="|bg-[#172235] block w-full px-4 py-3 text-white disabled:opacity-50 rounded-lg border ${temErro ? 'border-red-300 focus:border-red-500 focus:ring-red-500' : 'border-slate-600 focus:border-blue-500 focus:ring-blue-500'}|" th:classappend="${icone != null ? 'pl-11' : ''}" style="background-color: #172235 !important; color: #ffffff !important; color-scheme: dark;" />

      <input th:if="${disabledFlag}" type="hidden" th:name="${nomeAtributo}" th:value="*{__${nomeAtributo}__}" />

      <div th:if="${temErro}"
        class="end-0 absolute items-center inset-y-0 flex pointer-events-none justify-center pe-3">
        <svg class="shrink-0 size-4 text-red-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" x2="12" y1="8" y2="12"></line>
          <line x1="12" x2="12.01" y1="16" y2="16"></line>
        </svg>
      </div>
    </div>
    <p th:if="${#fields.hasErrors('__${nomeAtributo}__')}" th:each="erro : ${#fields.errors('__${nomeAtributo}__')}"
      th:text="${erro} + '. '" class="text-sm text-red-600 mt-2"></p>
  </th:block>

  <th:block th:unless="${validFlag}">
    <div class="relative">
      <th:block th:if="${icone != null}">
        <span class="pointer-events-none absolute inset-y-0 left-0 z-10 flex items-center pl-3 text-slate-400">
          <th:block th:replace="${icone}"></th:block>
        </span>
      </th:block>
<input type="text" th:name="${nomeAtributo}" th:id="${nomeAtributo}" th:value="${valorAtributo}"

        class="bg-[#172235] block w-full px-4 py-3 text-white disabled:opacity-50 border border-slate-600 rounded-lg focus:border-blue-500 focus:ring-blue-500" th:classappend="${icone != null ? 'pl-11' : ''}" style="background-color: #172235 !important; color: #ffffff !important; color-scheme: dark;" />

    </div>
  </th:block>
</th:block>

<th:block th:fragment="selectNormal" th:with="

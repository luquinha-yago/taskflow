<button @click="open = !open"
        th:fragment="menu-item-button(texto, svg)"
        xmlns:th="http://www.thymeleaf.org"
        type="button"
        class="group flex w-full items-center justify-between rounded-xl px-3 py-3 text-sm font-medium text-slate-400 transition-all duration-200 hover:bg-slate-700/50 hover:text-white focus:outline-none focus:ring-2 focus:ring-blue-500/30">

    <!-- Ícone e título -->
    <span class="flex min-w-0 items-center gap-3">

        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-slate-700/60 text-slate-400 transition-colors group-hover:bg-blue-500/10 group-hover:text-blue-400">

            <svg th:replace="${svg}"></svg>

        </span>

        <span th:text="${texto}"
              class="truncate">
            Menu
        </span>

    </span>

    <!-- Seta -->
    <span class="ml-2 flex h-6 w-6 shrink-0 items-center justify-center rounded-md text-slate-500 transition-all duration-200 group-hover:text-blue-400"
          :class="open ? 'rotate-90' : ''">

        <svg xmlns="http://www.w3.org/2000/svg"
             class="h-4 w-4"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
        </svg>

    </span>

</button>

<th:block th:fragment="cabecalho(titulo, descricao, imagem)"
          xmlns:th="http://www.thymeleaf.org">

    <section class="mb-8 flex flex-col gap-6 border-b border-slate-700/70 pb-6 sm:flex-row sm:items-center sm:justify-between">

        <!-- Textos -->
        <div class="min-w-0 flex-1">

            <h1 th:text="${titulo}"
                class="text-2xl font-bold tracking-tight text-white md:text-3xl">
                Título da página
            </h1>

            <p th:text="${descricao}"
               class="mt-2 max-w-2xl text-sm leading-relaxed text-slate-400 md:text-base">
                Descrição da página.
            </p>

        </div>

        <!-- Imagem opcional -->
        <div th:if="${imagem != null and !#strings.isEmpty(imagem)}"
             class="flex shrink-0 items-center justify-center">

            <img th:src="${imagem}"
                 th:alt="${titulo}"
                 class="h-24 w-24 object-contain md:h-28 md:w-28" />

        </div>

    </section>

</th:block>

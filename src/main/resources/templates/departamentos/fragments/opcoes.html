<!-- Itens do dropdown do componente inputBuscavel (lidos por app.js via data-value / data-text) -->

<!-- Empresas: exibe o nome fantasia ou, se vazio, a razão social -->
<th:block th:fragment="opcoesEmpresa" xmlns:th="http://www.thymeleaf.org">

    <li th:each="empresa : ${empresas}"
        th:with="nomeEmpresa=${#strings.isEmpty(#strings.trim(empresa.nomeFantasia)) ? empresa.razaoSocial : empresa.nomeFantasia}"
        th:attr="data-value=${empresa.codigo},data-text=${nomeEmpresa}"
        th:text="${nomeEmpresa}"
        class="px-4 py-2 text-sm text-slate-200 cursor-pointer hover:bg-slate-700">
    </li>

    <li th:if="${#lists.isEmpty(empresas)}"
        class="px-4 py-2 text-sm text-slate-400 pointer-events-none">
        Nenhuma empresa encontrada.
    </li>

</th:block>

<!-- Funcionários -->
<th:block th:fragment="opcoesFuncionario" xmlns:th="http://www.thymeleaf.org">

    <li th:each="funcionario : ${funcionarios}"
        th:attr="data-value=${funcionario.codigo},data-text=${funcionario.nome}"
        th:text="${funcionario.nome}"
        class="px-4 py-2 text-sm text-slate-200 cursor-pointer hover:bg-slate-700">
    </li>

    <li th:if="${#lists.isEmpty(funcionarios)}"
        class="px-4 py-2 text-sm text-slate-400 pointer-events-none">
        Nenhum funcionário encontrado.
    </li>

</th:block>
